[project]
name = "edjas"
version = "0.7.3"
description = "Extract data in JSON from any spreadsheet"
authors = [
    { name = "Steve Holden", email = "steve@holdenweb.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["spreadsheet", "excel", "xlsx", "openpyxl", "reporting", "json", "data-extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openpyxl>=3.1.5,<4.0.0",
]

[project.optional-dependencies]
# Rendering extracted data into HTML reports (edjas.report.render_report). Core EDJAS
# never imports Jinja2; install this extra to use the reporting demo:  pip install edjas[demo]
demo = ["jinja2>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edjas"]

[dependency-groups]
dev = ["pytest>=8", "jinja2>=3"]  # jinja2 exercises the optional reporting demo in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
edjas = "edjas:main"
