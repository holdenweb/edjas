<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EDJAS report{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --accent: #6c2eb9; --rule: #ccc; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5; margin: 0 auto; max-width: 54rem; padding: 2rem 1.25rem;
    color: #1c1a22; background: #fff;
  }
  header.report { border-bottom: 3px solid var(--accent); padding-bottom: 1rem; margin-bottom: 1.5rem; }
  header.report h1 { margin: 0 0 .4rem; font-size: 1.55rem; line-height: 1.25; }
  .meta { color: #555; font-size: .95rem; margin: .15rem 0; }
  h2 { font-size: 1.15rem; margin: 2rem 0 .5rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  .table-wrap { overflow-x: auto; margin: .75rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: .93rem; }
  caption { text-align: left; font-weight: 600; margin-bottom: .45rem; color: inherit; }
  th, td { border: 1px solid var(--rule); padding: .4rem .6rem; text-align: left; vertical-align: top; }
  thead th { background: #f0eaf9; position: sticky; top: 0; }
  tbody tr:nth-child(even) { background: rgba(108, 46, 185, .05); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  a { color: var(--accent); }
  footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid #ddd; color: #666; font-size: .85rem; }
  footer p { margin: .35rem 0; }
  @media (prefers-color-scheme: dark) {
    :root { --rule: #3a3444; }
    body { background: #14121a; color: #e6e1ef; }
    .meta, footer { color: #a9a2b8; }
    thead th { background: #241d33; }
    footer { border-top-color: #3a3444; }
  }
</style>
</head>
<body>
{% block content %}{% endblock %}
<footer>
{% block footer %}Generated by <a href="https://github.com/holdenweb/edjas">EDJAS</a>.{% endblock %}
</footer>
</body>
</html>
