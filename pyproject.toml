[project]
name = "edjas"
version = "0.8.0a3"
description = "Extract data in JSON from any spreadsheet"
authors = [
    { name = "Steve Holden", email = "steve@holdenweb.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["spreadsheet", "excel", "xlsx", "openpyxl", "reporting", "json", "data-extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openpyxl>=3.1.5,<4.0.0",
]

[project.optional-dependencies]
# The full reporting demo: Jinja2 for edjas.report.render_report, plus the companion
# edjas-examples package (seven real UK-government workbooks, specs and templates, and
# the `edjas-examples` command). Core EDJAS never imports either:  pip install edjas[demo]
#
# RELEASE ORDER: edjas-examples must be published to PyPI BEFORE (or together with) any
# edjas release carrying this extra, or `pip install edjas[demo]` fails to resolve.
# A plain `uv build` at the workspace root builds ONLY edjas; build the companion with
# `uv build --package edjas-examples`.
demo = ["jinja2>=3", "edjas-examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edjas"]

[tool.hatch.build.targets.sdist]
# The core sdist must not carry the companion package's tree (workbooks, templates,
# rendered reports) -- that data ships only in the separate edjas-examples distribution.
# /docs and /video are repo furniture -- the documentation-site source and the generator
# for the promotional animation -- and neither is part of the package.
# test_docs_site.py goes with /docs: it tests the site generator, which no sdist carries,
# so shipping it would only ever produce a skip.  The other optional-dependency tests do
# stay, because edjas-examples and Jinja2 are both installable alongside a core build.
exclude = [
    "/edjas-examples", "/docs", "/video", "/.github", "/uv.lock", "/.claude",
    "/tests/test_docs_site.py",
]

[dependency-groups]
# jinja2 + edjas-examples exercise the optional reporting demo in tests; edjas-examples
# resolves to the workspace member below during development.
dev = ["pytest>=8", "jinja2>=3", "edjas-examples"]
# Building the documentation site (docs/build_site.py). These are development-only
# dependency groups, never wheel metadata, so an installing user is unaffected: the
# published dependency footprint stays openpyxl alone.
# linkchecker verifies the built site's links; it is a docs-time tool, and would
# otherwise put an HTTP client, a DNS resolver and an HTML parser into every install.

# Generating and checking the promotional animation (video/).  Deliberately NOT in
# default-groups: a headless browser is a heavy install to inflict on every `uv sync`,
# and nothing else in the repository needs it.
video = ["playwright>=1.44", "pillow>=10"]

# zensical renders docs/md (written by docs/build_md.py) into docs/_zensical. It carries a
# compiled Rust core, so it is much the heaviest thing in this file -- another reason it
# belongs in a group and not in `dependencies`, where nothing but openpyxl may appear.
docs = [
  "markdown>=3.6",
  "jinja2>=3",
  "edjas-examples",
  "linkchecker>=10.6.0",
  "zensical>=0.0.57",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = ["edjas-examples"]

[tool.uv.sources]
edjas-examples = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["docs"]  # lets the tests import the site generator, docs/build_site.py

[project.scripts]
edjas = "edjas:main"

[project.urls]
Homepage = "https://github.com/holdenweb/edjas"
Source = "https://github.com/holdenweb/edjas"
